<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Anomancer Lighthouse Lab</title>
  <link rel="stylesheet" href="/lighthouse/lab.css">
</head>
<body>
  <main id="door" class="door">
    <section class="door-panel" aria-labelledby="doorTitle">
      <p class="eyebrow">LIGHTHOUSE LAB · D0</p>

      <div class="brand-lockup" aria-label="Anomancer">
        <img class="brand-wordmark" src="/media/brand/anomancer-wordmark.png" alt="" aria-hidden="true">
        <h1 id="doorTitle" class="sr-only">Anomancer</h1>
      </div>

      <p class="lead">Mitä haluat saada aikaan?</p>

      <form id="f" class="door-form">
        <label for="q" class="sr-only">Kerro mitä haluat saada aikaan</label>
        <textarea
          id="q"
          maxlength="12000"
          rows="7"
          required
          placeholder="Kirjoita ongelma, tavoite tai asia jonka haluat selvittää."></textarea>

        <div class="composer-meta">
          <span>Ctrl/⌘ + Enter jatkaa</span>
        </div>

        <div class="door-actions">
          <button id="go" type="submit" class="primary">Jatka</button>
        </div>

        <div class="door-mark" aria-hidden="true">
          <img class="brand-mark-footer" src="/media/brand/anomancer-mark.png" alt="">
        </div>

        <div id="doorProgress" class="progress-zone" hidden>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <p id="doorRaccoon" class="raccoon-line" aria-hidden="true"></p>
        </div>

        <div id="doorError" class="error-box" role="alert" hidden>
          <p id="doorErrorText"></p>
          <button id="doorRetry" type="button" class="retry">Yritä uudelleen</button>
        </div>
      </form>
    </section>
  </main>

  <main id="work" class="work" hidden>
    <nav class="work-nav">
      <button id="back" type="button" class="quiet">← Uusi työ</button>
      <span>D1 · TYÖ</span>
    </nav>

    <article id="resultCard" class="result-card" aria-live="polite">
      <header class="result-heading">
        <div>
          <p class="eyebrow" id="resultEyebrow">TÄSSÄ ON OLENNAISIN</p>
          <h2 id="title"></h2>
        </div>
        <span class="state-pill" id="statePill" hidden></span>
      </header>

      <div id="answer" class="answer"></div>

      <section id="questions" class="questions" hidden>
        <h3>Tarvitsen vielä</h3>
        <ul id="questionList"></ul>
      </section>

      <section id="next" class="result-section" hidden>
        <h3>Seuraavaksi</h3>
        <ul id="steps"></ul>
      </section>

      <section id="unc" class="uncertainty" hidden>
        <h3>Epävarmuus</h3>
        <p id="uncText"></p>
      </section>

      <section class="continuation" aria-labelledby="continueTitle">
        <div class="continuation-heading">
          <h3 id="continueTitle">Jatka tästä</h3>
          <span id="turnCount" class="turn-count"></span>
        </div>

        <form id="continueForm">
          <label for="continueInput" class="sr-only">Jatka nykyistä työtä</label>
          <textarea
            id="continueInput"
            rows="4"
            maxlength="12000"
            placeholder="Kirjoita jatko, tarkennus tai uusi kysymys tästä työstä."></textarea>

          <div class="composer-row">
            <span class="composer-meta">Ctrl/⌘ + Enter lähettää</span>
            <button id="continueButton" type="submit" class="primary">Jatka</button>
          </div>

          <div id="workProgress" class="progress-zone" hidden>
            <p id="workStatus" class="status" role="status" aria-live="polite"></p>
            <p id="workRaccoon" class="raccoon-line" aria-hidden="true"></p>
          </div>

          <div id="workError" class="error-box" role="alert" hidden>
            <p id="workErrorText"></p>
            <button id="workRetry" type="button" class="retry">Yritä uudelleen</button>
          </div>
        </form>
      </section>

      <details id="chainDetails" class="work-chain" hidden>
        <summary>
          <span>Työketju</span>
          <span id="chainSummary" class="chain-summary"></span>
        </summary>
        <ol id="chainList"></ol>
      </details>

      <details class="runtime">
        <summary>Miten tämä tehtiin?</summary>
        <pre id="runtime"></pre>
      </details>
    </article>
  </main>

  <script type="module" src="/lighthouse/lab.js"></script>
</body>
</html>
