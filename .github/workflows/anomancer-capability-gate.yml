name: Anomancer capability gate
run-name: Anomancer ${{ inputs.operation_id }} · ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Human-approved Anomancer operation id
        required: true
        type: string
      mode:
        description: Bounded capability adapter
        required: true
        type: choice
        options:
          - tests
          - preview
          - production
          - rollback
      source_ref:
        description: Exact approved Git ref
        required: false
        type: string
      rollback_target:
        description: Explicit Vercel deployment URL or id
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: anomancer-capability-${{ inputs.mode }}-${{ inputs.operation_id }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: '50.4.0'

jobs:
  verify:
    if: inputs.mode != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate bounded inputs
        shell: bash
        env:
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$INPUT_OPERATION_ID" =~ ^op-[a-z0-9-]{8,100}$ ]]
          [[ "$INPUT_SOURCE_REF" =~ ^(anomancer/op-[a-z0-9-]{8,80}|[a-f0-9]{40})$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Chromium gate
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          echo "CHROMIUM_BIN=$browser" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact source
        run: npm run build

      - name: Run full release gate
        run: npm run check

  deploy_preview:
    if: inputs.mode == 'preview'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull preview environment
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build prebuilt preview
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt preview
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy_production:
    if: inputs.mode == 'production'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull production environment
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build prebuilt production artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
      - name: Deploy exact prebuilt artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  rollback_production:
    if: inputs.mode == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Validate explicit rollback target
        shell: bash
        env:
          INPUT_OPERATION_ID: ${{ inputs.operation_id }}
          INPUT_ROLLBACK_TARGET: ${{ inputs.rollback_target }}
        run: |
          [[ "$INPUT_OPERATION_ID" =~ ^op-[a-z0-9-]{8,100}$ ]]
          [[ "$INPUT_ROLLBACK_TARGET" =~ ^https://([a-z0-9-]+\.)*vercel\.app/?$|^https://vercel\.com/[A-Za-z0-9._/-]{1,250}$|^dpl_[A-Za-z0-9]{8,200}$ ]]
      - name: Roll back explicit deployment
        env:
          INPUT_ROLLBACK_TARGET: ${{ inputs.rollback_target }}
        run: npx --yes vercel@${VERCEL_CLI_VERSION} rollback "$INPUT_ROLLBACK_TARGET" --token="$VERCEL_TOKEN" --yes
