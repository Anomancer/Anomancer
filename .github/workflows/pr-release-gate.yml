name: PR Release Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pr-release-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout pull request merge candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full release gate
        run: npm run check

      - name: Upload release-gate failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
